name: Deploy to Wasmer Edge

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: wasmer-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
      WASMER_DOMAIN: ${{ secrets.WASMER_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize npm registry
        shell: bash
        run: |
          if grep -q "registry.npmmirror.com" package-lock.json; then
            sed -i \
              's#https://registry.npmmirror.com#https://registry.npmjs.org#g' \
              package-lock.json
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Vite application
        run: npm run build

      - name: Verify build
        shell: bash
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build output:"
          du -sh dist
          find dist -maxdepth 2 -type f | head -50

      - name: Prepare Wasmer package
        shell: bash
        run: |
          rm -rf .wasmer/dist
          cp -a dist .wasmer/dist
      
          echo "Wasmer package contents:"
          find .wasmer/dist -maxdepth 2 -type f | head -50

      - name: Install Wasmer CLI
        shell: bash
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Check Wasmer CLI
        run: |
          wasmer --version
          wasmer whoami

      - name: Mask deployment domain
        shell: bash
        run: |
          echo "::add-mask::$WASMER_DOMAIN"
          echo "::add-mask::https://$WASMER_DOMAIN"

      - name: Test Wasmer package locally
        working-directory: .wasmer
        shell: bash
        run: |
          set -euo pipefail
      
          wasmer run . > /tmp/wasmer-local.log 2>&1 &
          WASMER_PID=$!
      
          cleanup() {
            kill "$WASMER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
      
          echo "Waiting for local Wasmer server..."
      
          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:8080/ \
              -o /tmp/wasmer-index.html; then
      
              echo "Local Wasmer package is healthy."
              echo "Response:"
              head -c 300 /tmp/wasmer-index.html
              echo
              exit 0
            fi
      
            sleep 1
          done
      
          echo "Local Wasmer package failed to start."
          echo "===== wasmer run output ====="
          cat /tmp/wasmer-local.log
          exit 1

      - name: Deploy to Wasmer Edge
        working-directory: .wasmer
        run: |
          wasmer deploy

      - name: Show Wasmer runtime logs
        if: always()
        run: |
          echo "===== Wasmer App Logs ====="
          wasmer app logs tax-check --max 200 || true

      - name: Show deployment info
        run: |
          wasmer app info adjiec/tax-check
